services:
  db:
    image: postgres:16-alpine
    container_name: joineazy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-joineazy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-joineazy_password}
      POSTGRES_DB: ${DB_NAME:-joineazy_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-joineazy_user} -d ${DB_NAME:-joineazy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joineazy-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: joineazy-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-joineazy_db}
      DB_USER: ${DB_USER:-joineazy_user}
      DB_PASSWORD: ${DB_PASSWORD:-joineazy_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - joineazy-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: joineazy-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - joineazy-network

volumes:
  pgdata:
    driver: local

networks:
  joineazy-network:
    driver: bridge
